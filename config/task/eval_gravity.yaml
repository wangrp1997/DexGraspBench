max_num: -1
obj_mass: 0.1   # unit: kg
miu_coef: [0.6, 0.02]
debug_render: False
debug_viewer: False
debug_dir: ${save_dir}/debug

# Real-gravity variant:
# - enable gravity in MuJoCo
# - do not inject equivalent external downward force
disable_gravity: False
use_external_gravity: False
ekf_input_debug: True
ekf_input_print_every: 20
ekf_input_stage: post_lift   # all | post_lift
ekf_input_post_lift_steps: -1   # -1 means keep printing while debug_viewer window is open
ekf_smoke_enable: True
ekf_smoke_print_every: 50
ekf_contact_warn_ratio: 0.6   # warn when (new+lost)/max(1, prev+curr) exceeds this value
ekf_step_every: 2   # run EKF callback every N sim steps (>=1)
ekf_contact_rho_plus: 0.10   # Eq.(21)(22) add threshold for w_j
ekf_contact_rho_minus: 0.03  # Eq.(25) remove threshold for w_j (must be < rho_plus)
ekf_contact_score_eps: 1e-9  # epsilon for w_j = f_j/sqrt(d_j)
ekf_q_x: 5e-4   # group-2: process noise for x(6) block
ekf_q_xi: 3e-3  # group-3: process noise for xi(2n) block
ekf_q_f: 1e-2   # group-3: process noise for f(n) block
ekf_r_q: 2e-3   # group-2: measurement noise for q(m) block
ekf_r_tau: 5e-2 # group-3: measurement noise for tau(m) block
ekf_no_contact_steps_threshold: 8   # after N no-contact EKF steps, weaken torque update
ekf_no_contact_tau_R_scale: 500.0   # multiply R_tau block when in prolonged no-contact
ekf_audit_enable: True   # run Eq.(24)(25) index-consistency audit for y/P/Q/contact mapping
ekf_audit_every: 20   # audit every N EKF callback steps
ekf_g_sanity_enable: True   # print Eq.(6) G/J_motion sanity metrics in [EKF-SMOKE]
ekf_pose_eval_enable: True   # print EKF pose-estimation error against MuJoCo GT
ekf_pose_eval_print_every: 50  # [EKF-METRIC] print period

simulation_metrics:
  max_pene: 0.01  # If the initial hand penetrates the object too much, regard it as a failure
  trans_thre: 0.05
  angle_thre: 15

analytic_fc_metrics:
  contact_tip_only: True
  contact_threshold: 0.005
  type: ['qp', 'qp_dfc', 'q1', 'tdg', 'dfc']

pene_contact_metrics:
  contact_margin: 0.01  # unit: m. Max contact distance.
  contact_threshold: 0.002
